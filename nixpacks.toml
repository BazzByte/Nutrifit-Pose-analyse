[phases.setup]
nixPkgs = ["libGL", "glib", "gcc-unwrapped", "xorg.libxcb", "xorg.libX11", "xorg.libXext", "xorg.libXrender", "xorg.libSM", "xorg.libXext", "fontconfig", "freetype"]

[phases.build]
